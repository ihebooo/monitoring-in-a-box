name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh postgres/initdb/*.sh
      - name: check_targets.sh --help / bad options
        run: |
          ./scripts/check_targets.sh --help | grep -q '^Usage:'
          ./scripts/check_targets.sh --version | grep -q '^check_targets.sh '
          set +e
          for args in "--nope" "--timeout" "--timeout abc" "--interval 0"; do
            # shellcheck disable=SC2086
            ./scripts/check_targets.sh $args; rc=$?; echo "$args -> exit $rc"; [ "$rc" -eq 3 ] || exit 1
          done
      - name: Prometheus unreachable gives exit 2
        run: |
          set +e
          ./scripts/check_targets.sh -u http://127.0.0.1:1 -t 2 -i 1; rc=$?; echo "exit $rc"; [ "$rc" -eq 2 ]
      - name: docker compose config is valid
        run: docker compose config --quiet
      - name: promtool check config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: promtool check rules + rule unit tests
        run: |
          docker run --rm --entrypoint promtool             -v "$PWD/prometheus:/etc/prometheus:ro"             prom/prometheus:v2.55.1 check rules /etc/prometheus/rules/postgresql.yml
          docker run --rm --entrypoint promtool -w /etc/prometheus/tests             -v "$PWD/prometheus:/etc/prometheus:ro"             prom/prometheus:v2.55.1 test rules postgresql_test.yml

  stack:
    runs-on: ubuntu-latest
    env:
      GRAFANA_ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d && docker compose ps
      - name: All Prometheus targets are up (prometheus, node, grafana, postgres)
        run: ./scripts/check_targets.sh --timeout 180 --min 4
      - name: postgres_exporter connects to PostgreSQL and exposes the alert inputs
        run: |
          q() { curl -fsS 'http://localhost:9090/api/v1/query' --data-urlencode "query=$1"; }
          ok=false
          for _ in $(seq 1 45); do
            if q 'pg_up{job="postgres"}' | jq -e '.data.result[0].value[1] == "1"' >/dev/null; then ok=true; break; fi
            sleep 2
          done
          $ok || { echo "pg_up never reached 1"; q 'pg_up'; exit 1; }
          # every metric the alert rules use must exist, or the alerts can never fire
          for m in pg_settings_max_connections pg_stat_activity_count pg_replication_is_replica pg_replication_lag_seconds; do
            n=$(q "count($m)" | jq -r '.data.result[0].value[1] // "0"')
            echo "$m: $n series"; [ "$n" -gt 0 ]
          done
      - name: Alert rules are loaded and nothing is firing
        run: |
          curl -fsS http://localhost:9090/api/v1/rules             | jq -e '[.data.groups[] | select(.name == "postgresql") | .rules[] | select(.health == "ok")] | length == 4'
          curl -fsS http://localhost:9090/api/v1/alerts             | jq -e '[.data.alerts[] | select(.state == "firing")] | length == 0'
      - name: node_exporter metrics reach Prometheus
        run: |
          curl -fsS 'http://localhost:9090/api/v1/query' --data-urlencode 'query=up{job="node"}' \
            | jq -e '.data.result[0].value[1] == "1"'
          curl -fsS 'http://localhost:9090/api/v1/query' --data-urlencode 'query=count(node_filesystem_size_bytes)' \
            | jq -e '(.data.result[0].value[1] | tonumber) > 0'
      - name: Grafana is healthy and the Prometheus datasource works
        run: |
          for _ in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS -u "admin:$GRAFANA_ADMIN_PASSWORD" http://localhost:3000/api/datasources/uid/prometheus \
            | jq -e '.type == "prometheus" and .isDefault == true'
          curl -fsS -u "admin:$GRAFANA_ADMIN_PASSWORD" http://localhost:3000/api/datasources/uid/prometheus/health \
            | jq -e '.status == "OK"'
      - name: Ports are bound to 127.0.0.1 only
        run: |
          docker compose port prometheus 9090 | grep -q '^127.0.0.1:'
          docker compose port grafana 3000 | grep -q '^127.0.0.1:'
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a; docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
