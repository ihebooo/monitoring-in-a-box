# monitoring-in-a-box — Prometheus + node_exporter + Grafana + postgres_exporter (+ demo PostgreSQL)
#
#   cp .env.example .env      # set GRAFANA_ADMIN_PASSWORD
#   docker compose up -d
#   ./scripts/check_targets.sh
#
# Ports are published on 127.0.0.1 only (BIND_ADDR). Put a reverse proxy with TLS
# in front, or set BIND_ADDR=0.0.0.0 only on a trusted network.

name: monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle        # POST /-/reload after editing the config
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      # skip container/virtual mounts so disk alerts only see real filesystems
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    # not published: only Prometheus needs it, over the compose network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Demo database so the PostgreSQL alerts have something to watch. To monitor your own
  # server instead, remove this service and point DATA_SOURCE_URI below at it.
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:-exporter-demo-only}
    volumes:
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: during initdb the server only listens on the Unix socket
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    # not published: only postgres-exporter talks to it
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter        # pg_monitor role, see postgres/initdb/
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:-exporter-demo-only}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
