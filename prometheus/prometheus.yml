global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: monitoring-in-a-box

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Docker host this stack runs on.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: docker-host

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # One postgres_exporter per PostgreSQL server; "instance" names the database server.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          instance: demo-postgres

  # HTTPS endpoints: Prometheus asks blackbox_exporter to probe each URL listed in
  # targets/https.yml. "instance" becomes the URL; the scrape goes to the exporter.
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    scrape_interval: 30s
    scrape_timeout: 15s
    file_sd_configs:
      - files: ["targets/https.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # More Linux servers: install node_exporter on them and list them here, e.g.
  # - job_name: node-remote
  #   static_configs:
  #     - targets: ["db1.example.com:9100", "192.0.2.10:9100"]
